conky.config = {
    alignment = 'top_right',
    background = false,
    update_interval = 1,
    double_buffer = true,
    own_window = true,
    own_window_type = 'normal',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 0,     -- fully transparent, no backing panel
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    border_width = 0,
    minimum_width = 320,
    default_color = 'f5c2e7',
    default_outline_color = '1a1225',
    default_shade_color = '1a1225',
    draw_shades = true,           -- drop shadow for extra depth
    draw_outline = true,          -- thick outline does the contrast work now, no panel
    use_xft = true,
    font = 'Lilita One:size=13',
    gap_x = 20,
    gap_y = 50,
}

conky.text = [[
${color f5c2e7}${font Lilita One:size=16}${voffset 4}♪ NOW PLAYING${font}
${voffset 6}${color ffffff}${execi 1 ~/.config/conky/now_playing.sh}
${voffset 6}${color f38ba8}${execibar 1 playerctl position --format '{{ (position/length)*100 }}' 2>/dev/null || echo 0}
]]
