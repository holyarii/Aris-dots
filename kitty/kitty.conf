# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #

# you can choose themes from $HOME/.config/kitty/kitty-themes/
# colors now defined directly below (Catppuccin Mocha, black bg) —
# leave this commented out so it doesn't override them
# include ./kitty-themes/00-Default.conf

font_family FantasqueSansM Nerd Font Mono Bold
font_size 14.0
bold_font auto
italic_font auto
bold_italic_font auto

# Note: kitty can't do blur itself — this only controls transparency.
# Actual blur is a KWin effect (System Settings > Desktop Effects > Blur),
# applied to any transparent window, kitty included.
background_opacity 0.75
dynamic_background_opacity 1
confirm_os_window_close 0

# Animated cursor
cursor_trail 1

# change to x11 or wayland or leave auto
linux_display_server auto

scrollback_lines 2000
wheel_scroll_min_lines 1

enable_audio_bell no

window_padding_width 4

selection_foreground #1e1e2e
selection_background #f5c2e7

# ---- Catppuccin Mocha (bg forced to true black) ----
foreground              #cdd6f4
background              #000000
cursor                  #f5c2e7
cursor_text_color       #1e1e2e

url_color               #f5e0dc

# black
color0  #45475a
color8  #585b70

# red
color1  #f38ba8
color9  #f38ba8

# green
color2  #a6e3a1
color10 #a6e3a1

# yellow
color3  #f9e2af
color11 #f9e2af

# blue
color4  #89b4fa
color12 #89b4fa

# magenta / pink
color5  #f5c2e7
color13 #f5c2e7

# cyan
color6  #94e2d5
color14 #94e2d5

# white
color7  #bac2de
color15 #a6adc8

# tabs
active_tab_foreground   #1e1e2e
active_tab_background   #f5c2e7
inactive_tab_foreground #cdd6f4
inactive_tab_background #181825

# borders / window
active_border_color     #f5c2e7
inactive_border_color   #6c7086
